server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # nginx is the first body-size boundary in the production container. The
    # FastAPI middleware independently enforces the same limit for direct calls.
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"bantam-web"}';
    }

    location /api/ {
        proxy_pass ${BANTAM_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Edge mode renders this as $remote_addr and discards untrusted client
        # metadata. Trusted-edge and Cloud Run modes preserve the headers that
        # the reviewed upstream proxy has already sanitized.
        # FastAPI accepts either only from this explicitly trusted proxy.
        proxy_set_header X-Forwarded-For ${BANTAM_X_FORWARDED_FOR};
        proxy_set_header X-Forwarded-Proto ${BANTAM_X_FORWARDED_PROTO};
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
