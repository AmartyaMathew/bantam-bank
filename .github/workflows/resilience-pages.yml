name: Bantam resilience report

on:
  pull_request:
  push:
    branches: [main, fix/production-login-no-demo-credentials]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build evidence-linked report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned development tools
        run: python -m pip install -e '.[dev]'

      - name: Verify deterministic workflow catalogue
        run: >-
          python -m bantam.workflow_graph check
          --root .
          --output bantam/workflow_catalog.json

      - name: Test the report publication boundary
        run: python -m pytest tests/test_resilience_report.py

      - name: Build the Pages artifact from this commit
        run: >-
          python -m scripts.resilience_report build
          --root .
          --catalogue bantam/workflow_catalog.json
          --model report/risk-model.json
          --static report/site
          --output _site
          --commit "$GITHUB_SHA"

      - name: Check browser JavaScript syntax
        run: node --check _site/app.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy report to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/production-login-no-demo-credentials'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy the immutable artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
