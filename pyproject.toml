[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bantam-bank"
version = "0.2.0"
description = "A fake-money digital bank for architecture and compliance practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==5.0.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "nats-py==2.15.0",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic==2.13.4",
  "PyJWT==2.13.0",
  "pyotp==2.10.0",
  "uvicorn[standard]==0.51.0",
  "webauthn==3.0.0",
]

[project.optional-dependencies]
dev = [
  "defusedxml==0.7.1",
  "pytest==9.1.1",
  "ruff==0.15.21",
]
security = [
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "semgrep==1.175.0",
]

[project.scripts]
bantam = "bantam.__main__:main"

[tool.setuptools.packages.find]
include = [
  "bantam*",
  "security",
  "security.aspis",
  "security.aspis.core*",
  "security.aspis.asvs*",
]

[tool.setuptools.package-data]
"bantam" = ["workflow_catalog.json", "company_financials.json"]
"security.aspis.asvs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a live PostgreSQL database",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
