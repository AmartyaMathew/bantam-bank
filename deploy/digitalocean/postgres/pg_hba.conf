# Local socket access is confined to the PostgreSQL container and is used by
# health checks and backups. Every bridge-network connection must use TLS and
# SCRAM; anything outside the private data subnet falls through to rejection.
local       all  all                         trust
hostnossl   all  all  0.0.0.0/0             reject
hostnossl   all  all  ::/0                  reject
hostssl     all  all  172.31.0.0/24         scram-sha-256
