name: bantam

x-bantam-environment: &bantam-environment
  APP_ENV: development
  DATABASE_URL: postgres://bantam:bantam@postgres:5432/bantam?sslmode=disable
  DATABASE_POOL_MIN_SIZE: "1"
  DATABASE_POOL_MAX_SIZE: "8"
  NATS_URL: nats://nats:4222
  JWT_SECRET: local-compose-jwt-secret-for-development-only-2026
  SCA_SECRET: local-compose-sca-secret-for-development-only-2026
  CLAIMS_SECRET: local-compose-claims-secret-for-development-only-2026
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  MFA_TRANSACTION_TTL: "5m"
  MFA_STEP_UP_TTL: "5m"
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
  WEBAUTHN_RP_NAME: Bantam
  WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:3000}
  DEMO_MODE: "true"
  ALLOW_DEMO_SEED: "true"
  ALLOWED_HOSTS: "*"
  TRUSTED_PROXY_CIDRS: 172.28.0.0/24
  SCA_THRESHOLD_MINOR: "500000"
  RISK_THRESHOLD_MINOR: "500000"
  REQUEST_BODY_LIMIT_BYTES: "1048576"
  AUTH_ACCOUNT_RATE_LIMIT_MAX: "10"
  AUTH_IP_RATE_LIMIT_MAX: "50"
  ASVS_LIVE_RUNNER_ENABLED: "true"
  ASVS_TARGET_COMMIT: ${ASPIS_TARGET_COMMIT:-local-working-tree}

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,noexec,nosuid,nodev
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  build:
    context: ..
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  networks:
    - bantam-internal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bantam
      POSTGRES_PASSWORD: bantam
      POSTGRES_DB: bantam
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantam -d bantam"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - bantam-internal

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - bantam-internal

  bantam-api:
    <<: *service-defaults
    command: ["api"]
    environment:
      <<: *bantam-environment
      HTTP_ADDR: :8080
      ASVS_AI_GENERATOR_ENABLED: ${ASVS_AI_GENERATOR_ENABLED:-true}
      ASPIS_MISTRAL_API_KEY: ${ASPIS_MISTRAL_API_KEY:-}
      WORKFLOW_GITHUB_TOKEN: ${WORKFLOW_GITHUB_TOKEN:-}
      ASPIS_APPLICATION_SOURCE_ROOT: /source-context/application
      ASPIS_TERRAFORM_SOURCE_ROOT: /source-context/terraform
    volumes:
      - type: bind
        source: ..
        target: /source-context/application
        read_only: true
      - type: bind
        source: ${ASPIS_TERRAFORM_SOURCE_DIR:-../security/aspis}
        target: /source-context/terraform
        read_only: true
    ports:
      - "0.0.0.0:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build:
      context: ../web
      target: development
    environment:
      API_PROXY_TARGET: http://bantam-api:8080
      CHOKIDAR_USEPOLLING: "true"
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      bantam-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - bantam-internal

  outbox-publisher:
    <<: *service-defaults
    command: ["outbox-publisher"]
    environment: *bantam-environment

  risk-worker:
    <<: *service-defaults
    command: ["risk-worker"]
    environment: *bantam-environment

  notification-worker:
    <<: *service-defaults
    command: ["notification-worker"]
    environment: *bantam-environment

  seed:
    <<: *service-defaults
    restart: "no"
    command: ["seed"]
    environment: *bantam-environment

volumes:
  postgres-data:
  nats-data:
  web-node-modules:

networks:
  bantam-internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
